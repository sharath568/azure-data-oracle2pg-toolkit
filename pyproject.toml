[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "o2pg"
version = "0.1.0"
description = "Offline triage of Oracle schemas before migrating to Azure Database for PostgreSQL Flexible Server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Sharath Chandra Kampili", email = "sharath568@gmail.com" }]
keywords = ["oracle", "postgresql", "azure", "migration", "database", "plsql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]
dependencies = ["click>=8.1"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
o2pg = "o2pg.cli:main"

[project.urls]
Homepage = "https://github.com/sharath568/azure-data-oracle2pg-toolkit"
Issues = "https://github.com/sharath568/azure-data-oracle2pg-toolkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/o2pg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PIE", "PT"]
# Keyword lists read better as one whitespace-separated string than as 90 list items.
ignore = ["SIM905"]
