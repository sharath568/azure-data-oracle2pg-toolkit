name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Tests
        run: pytest
      - name: Generated docs are current
        run: python scripts/gen_rules_doc.py --check
      - name: Smoke test the CLI
        run: |
          o2pg sample -o /tmp/inv.json
          o2pg assess /tmp/inv.json -f html -o /tmp/report.html
          o2pg map-types /tmp/inv.json -o /tmp/schema.sql
